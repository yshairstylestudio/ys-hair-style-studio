<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ys Hair Style Studio v3.6</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f0f2f5;color:#222;padding-bottom:80px}
    .top{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .top h1{font-size:18px}
    .top h1 span{color:#c9a84c}
    .top .user{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .logout-btn{padding:6px 16px;background:#dc3545;color:#fff;border:0;border-radius:6px;cursor:pointer}
    .wrap{max-width:1200px;margin:auto;padding:12px}
    .tabs{display:flex;gap:5px;flex-wrap:wrap;background:#f0f2f5;padding:8px 0;position:sticky;top:0;z-index:99}
    .tabs button{padding:8px 16px;border:0;border-radius:6px;background:#fff;color:#333;cursor:pointer;font-size:13px;border-bottom:3px solid transparent}
    .tabs button.active{background:#1a1a2e;color:#fff;border-bottom-color:#c9a84c}
    .page{display:none}
    .page.active{display:block}
    .panel{background:#fff;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .panel h3{margin-bottom:12px;font-size:16px;color:#1a1a2e;border-left:4px solid #c9a84c;padding-left:12px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
    .card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
    .card .num{font-size:28px;font-weight:bold;color:#1a1a2e;margin-top:4px}
    .card .label{font-size:13px;color:#888}
    .card.gold .num{color:#c9a84c}
    .card.green .num{color:#0e7c4b}
    .card.red .num{color:#c0392b}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
    .row>*{flex:1;min-width:80px}
    input,select,textarea{padding:10px 12px;border:1px solid #ddd;border-radius:8px;width:100%;font-size:15px}
    input:focus,select:focus{outline:none;border-color:#c9a84c}
    button{padding:10px 20px;border:0;border-radius:8px;background:#1a1a2e;color:#fff;cursor:pointer;font-size:14px;min-height:44px}
    button.gold{background:#c9a84c}
    button.green{background:#0e7c4b}
    button.red{background:#c0392b}
    table{width:100%;border-collapse:collapse;font-size:13px}
    td,th{padding:8px 6px;border-bottom:1px solid #eee;text-align:left}
    th{background:#f8f8f8;font-weight:600}
    .badge{padding:3px 12px;border-radius:20px;font-size:12px;display:inline-block}
    .badge.green{background:#d4edda;color:#155724}
    .badge.red{background:#f8d7da;color:#721c24}
    .badge.gold{background:#fff3cd;color:#856404}
    .total{font-size:32px;color:#c0392b;font-weight:bold}
    .hide{display:none!important}
    .text-muted{color:#999;font-size:13px}
    .flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .mt-8{margin-top:8px}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
    .product-item{background:#fff;border:2px solid #e0e0e0;border-radius:8px;padding:10px;text-align:center}
    .product-item .p-name{font-size:14px;font-weight:600}
    .product-item .p-price{font-size:13px;color:#c9a84c;font-weight:bold}
    .product-item .qty-control{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
    .product-item .qty-control button{width:28px;height:28px;padding:0;min-height:28px;font-size:16px;border-radius:4px}
    .product-item .qty-control button.minus-btn{background:#e74c3c;color:#fff}
    .product-item .qty-control button.plus-btn{background:#0e7c4b;color:#fff}
    .product-item .qty-control .qty-num{font-size:16px;font-weight:bold;min-width:24px;text-align:center}
    .product-item.selected{border-color:#c9a84c;background:#fff8e7}
    .category-section{margin-bottom:8px;border:1px solid #eee;border-radius:10px;overflow:hidden}
    .category-header{background:#f5f5f5;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;font-weight:bold;font-size:15px;color:#1a1a2e}
    .category-header .arrow{transition:transform .3s;font-size:14px;color:#999}
    .category-header .arrow.open{transform:rotate(180deg)}
    .category-body{display:none;padding:10px;background:#fafafa}
    .category-body.open{display:block}
    .cart-table .qty-cell{display:flex;align-items:center;gap:6px;justify-content:center}
    .cart-table .qty-cell button{width:24px;height:24px;padding:0;min-height:24px;font-size:14px;border-radius:4px}
    .cart-table .qty-cell button.minus-btn{background:#e74c3c;color:#fff}
    .cart-table .qty-cell button.plus-btn{background:#0e7c4b;color:#fff}
    .cart-table .qty-cell .qty-num{font-size:15px;font-weight:bold;min-width:24px;text-align:center}
    .discount-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .discount-group input{width:70px}
    .login-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
    .login-actions button{padding:8px 20px;font-size:13px;min-height:36px}
    .login-actions .register-btn{background:#4CAF50}
    .login-actions .reset-btn{background:#FF9800}
    .loading-screen{position:fixed;inset:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff}
    .loading-screen .spinner{width:40px;height:40px;border:4px solid #c9a84c;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-screen p{margin-top:12px;font-size:14px;color:#9ca3af}
    @media(max-width:600px){.tabs button{font-size:12px;padding:6px 10px}.cards{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>⏳ 加载中...</p>
</div>

<header class="top">
  <h1>✂️ Ys <span>Hair Style</span> Studio · v3.6</h1>
  <div class="user">
    <span id="who">👤 未登录</span>
    <button onclick="logout()" class="logout-btn">🚪 退出</button>
  </div>
</header>

<div class="wrap">
  <!-- 登录 -->
  <div id="login" class="panel" style="max-width:400px;margin:40px auto">
    <h2 style="text-align:center;color:#1a1a2e">✂️ 登录系统</h2>
    <p style="text-align:center;color:#999;font-size:13px">使用 Firebase 邮箱密码登录</p>
    <input id="un" placeholder="邮箱 (Email)" type="email">
    <input id="pw" type="password" placeholder="密码 (Password)">
    <button id="loginBtn" style="width:100%;padding:14px;background:#c9a84c;font-size:16px;border:0;border-radius:8px;color:#fff;cursor:pointer">登 录</button>
    <div class="login-actions">
      <button onclick="register()" class="register-btn">📝 注册新账号</button>
      <button onclick="resetPassword()" class="reset-btn">🔑 忘记密码</button>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app" class="hide">
    <div class="tabs">
      <button class="active" onclick="page('dash')">📊 总览</button>
      <button onclick="page('pos')">💇 POS</button>
      <button onclick="page('orders')">📋 订单</button>
      <button onclick="page('staff')">👨‍💼 员工</button>
      <button onclick="page('settings')">⚙️ 设置</button>
    </div>

    <!-- Dashboard -->
    <section id="dash" class="page active">
      <h2>📊 经营总览</h2>
      <div class="cards">
        <div class="card gold"><div class="label">💰 今日营业额</div><div class="num" id="todaySales">RM 0</div></div>
        <div class="card"><div class="label">📋 今日订单</div><div class="num" id="todayOrders">0</div></div>
        <div class="card green"><div class="label">👤 总会员</div><div class="num" id="totalMembers">0</div></div>
        <div class="card red"><div class="label">👨‍💼 员工数</div><div class="num" id="totalStaff">0</div></div>
      </div>
      <div class="panel">
        <h3>📋 今日顾客消费明细</h3>
        <div style="max-height:300px;overflow-y:auto"><table><thead><tr><th>时间</th><th>顾客</th><th>员工</th><th>服务</th><th>金额</th><th>支付</th></tr></thead><tbody id="todayDetail"></tbody></table></div>
      </div>
    </section>

    <!-- POS -->
    <section id="pos" class="page">
      <h2>💇 POS 收银</h2>
      <div class="row">
        <div><select id="cus"><option value="">散客</option></select></div>
        <div><select id="st"></select></div>
      </div>
      <div class="panel" style="background:#f8f6f0">
        <h3 style="border-left-color:#0e7c4b;">📦 服务列表</h3>
        <div id="productContainer"></div>
      </div>
      <div class="panel">
        <h3>🛒 购物车</h3>
        <table class="cart-table"><thead><tr><th>服务</th><th style="text-align:center">单价</th><th style="text-align:center">数量</th><th style="text-align:center">小计</th><th style="text-align:center">操作</th></tr></thead><tbody id="cartBody"></tbody></table>
        <div class="flex-between" style="margin-top:12px">
          <div>
            <span class="total" id="sum">RM 0.00</span>
            <span id="discountSummary" class="text-muted" style="font-size:14px;margin-left:12px;"></span>
          </div>
          <div class="flex">
            <select id="pay" style="width:auto;flex:0">
              <option>Cash 现金</option><option>DuitNow QR</option><option>Card 刷卡</option><option>Bank Transfer</option><option>会员储值</option>
            </select>
            <button onclick="checkout()" class="green" style="padding:12px 32px">✅ 收款</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 订单 -->
    <section id="orders" class="page">
      <h2>📋 订单报表</h2>
      <div class="panel" style="overflow:auto"><table><thead><tr><th>单号</th><th>日期</th><th>顾客</th><th>金额</th><th>支付</th><th>状态</th></tr></thead><tbody id="orderRows"></tbody></table></div>
    </section>

    <!-- 员工 -->
    <section id="staff" class="page">
      <h2>👨‍💼 员工管理</h2>
      <div class="panel">
        <div class="row">
          <input id="sn" placeholder="姓名 *">
          <input id="srate" type="number" placeholder="提成 %" value="40">
          <button onclick="addStaff()" class="gold">➕ 添加员工</button>
        </div>
      </div>
      <div class="panel" style="overflow:auto"><table><thead><tr><th>姓名</th><th>提成</th><th>本月业绩</th><th>本月佣金</th><th>操作</th></tr></thead><tbody id="staffList"></tbody></table></div>
    </section>

    <!-- 设置 -->
    <section id="settings" class="page">
      <h2>⚙️ 设置</h2>
      <div class="panel" style="border:2px solid #c9a84c">
        <h3>🔐 修改登录密码</h3>
        <div class="row">
          <input id="oldPw" type="password" placeholder="当前密码">
          <input id="newPw" type="password" placeholder="新密码 (至少6位)">
          <input id="confirmPw" type="password" placeholder="确认新密码">
          <button onclick="changePassword()" class="gold">✅ 修改</button>
        </div>
      </div>
      <div class="panel" style="border:2px solid #c0392b">
        <h3>💾 数据管理</h3>
        <div class="flex"><button onclick="exportData()" class="gold">📤 导出</button><button onclick="importData()" class="outline" style="background:transparent;border:2px solid #1a1a2e;color:#1a1a2e">📥 导入</button><button onclick="clearAllData()" class="red">🗑️ 清除</button></div>
      </div>
    </section>
  </div>
</div>

<script>
// ============================================================
//  Firebase 配置
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDeVPQbKSi-4O-7gx55c6ZwacBXGTrPFJI",
  authDomain: "ys-hair-style-studio.firebaseapp.com",
  databaseURL: "https://ys-hair-style-studio-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ys-hair-style-studio",
  storageBucket: "ys-hair-style-studio.firebasestorage.app",
  messagingSenderId: "1013042053262",
  appId: "1:1013042053262:web:81e155d05672843d5909df"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// ============================================================
//  数据 - 简化版
// ============================================================
let cache = {};
let customers = [], staffs = [], orders = [], categories = [], nextId = {};

function loadData(callback) {
  db.ref('/').once('value').then(snap => {
    const data = snap.val() || {};
    if (!data.initialized) {
      // 首次使用，创建默认数据
      const defaultData = {
        initialized: true,
        categories: [
          {id:1,name:'✂️ Hair Cut',options:[{id:101,name:'Male Cut',price:58,rate:100},{id:102,name:'Female Cut',price:68,rate:100}]},
          {id:2,name:'🎨 Hair Color',options:[{id:201,name:'Color Short',price:130,rate:100},{id:202,name:'Color Medium',price:160,rate:100},{id:203,name:'Color Long',price:190,rate:100}]},
          {id:3,name:'🔥 Perm',options:[{id:301,name:'Perm Short',price:238,rate:100},{id:302,name:'Perm Medium',price:268,rate:100},{id:303,name:'Perm Long',price:298,rate:100}]},
          {id:4,name:'💆 Treatment',options:[{id:401,name:'Treatment Short',price:220,rate:100},{id:402,name:'Treatment Medium',price:250,rate:100},{id:403,name:'Treatment Long',price:280,rate:100}]},
          {id:5,name:'✨ Other',options:[{id:501,name:'Fringe Cut',price:20,rate:100},{id:503,name:'Hair Wash',price:48,rate:100}]}
        ],
        customers: [],
        staff: [{id:1,name:'Kent',rate:40,paid_periods:[]},{id:2,name:'Hilson',rate:50,paid_periods:[]}],
        orders: [],
        products: [],
        appointments: [],
        expenses: [],
        settlements: [],
        nextId: {customer:1,order:1,product:1,appt:1,expense:1,settlement:1,category:6,option:504,staff:3}
      };
      db.ref('/').set(defaultData).then(() => {
        cache = defaultData;
        refreshData();
        if (callback) callback();
      });
    } else {
      cache = data;
      refreshData();
      if (callback) callback();
    }
  }).catch(err => {
    console.log('加载失败，使用默认数据');
    cache = getDefaultData();
    refreshData();
    if (callback) callback();
  });
}

function getDefaultData() {
  return {
    initialized: true,
    categories: [{id:1,name:'✂️ Hair Cut',options:[{id:101,name:'Male Cut',price:58,rate:100},{id:102,name:'Female Cut',price:68,rate:100}]},{id:2,name:'🎨 Hair Color',options:[{id:201,name:'Color Short',price:130,rate:100},{id:202,name:'Color Medium',price:160,rate:100},{id:203,name:'Color Long',price:190,rate:100}]},{id:3,name:'🔥 Perm',options:[{id:301,name:'Perm Short',price:238,rate:100},{id:302,name:'Perm Medium',price:268,rate:100},{id:303,name:'Perm Long',price:298,rate:100}]},{id:4,name:'💆 Treatment',options:[{id:401,name:'Treatment Short',price:220,rate:100},{id:402,name:'Treatment Medium',price:250,rate:100},{id:403,name:'Treatment Long',price:280,rate:100}]},{id:5,name:'✨ Other',options:[{id:501,name:'Fringe Cut',price:20,rate:100},{id:503,name:'Hair Wash',price:48,rate:100}]}],
    customers: [],
    staff: [{id:1,name:'Kent',rate:40,paid_periods:[]},{id:2,name:'Hilson',rate:50,paid_periods:[]}],
    orders: [],
    products: [],
    appointments: [],
    expenses: [],
    settlements: [],
    nextId: {customer:1,order:1,product:1,appt:1,expense:1,settlement:1,category:6,option:504,staff:3}
  };
}

function refreshData() {
  customers = cache.customers || [];
  staffs = cache.staff || [];
  orders = cache.orders || [];
  categories = cache.categories || [];
  nextId = cache.nextId || {customer:1,order:1,product:1,appt:1,expense:1,settlement:1,category:6,option:504,staff:3};
}

function saveData() {
  cache.customers = customers;
  cache.staff = staffs;
  cache.orders = orders;
  cache.categories = categories;
  cache.nextId = nextId;
  db.ref('/').set(cache).then(() => {
    console.log('✅ 数据已保存');
  }).catch(err => {
    console.log('❌ 保存失败:', err);
  });
}

// ============================================================
//  Auth
// ============================================================
function login() {
  var email = document.getElementById('un').value.trim();
  var password = document.getElementById('pw').value.trim();
  if (!email || !password) return alert('请填写邮箱和密码');
  document.getElementById('loginBtn').textContent = '⏳...';
  auth.signInWithEmailAndPassword(email, password).then(user => {
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('who').textContent = '👤 ' + user.user.email;
    document.getElementById('loadingScreen').style.display = 'flex';
    loadData(() => {
      loadAll();
      document.getElementById('loadingScreen').style.display = 'none';
    });
    document.getElementById('loginBtn').textContent = '登 录';
  }).catch(err => {
    alert('❌ ' + err.message);
    document.getElementById('loginBtn').textContent = '登 录';
  });
}

function register() {
  var email = document.getElementById('un').value.trim();
  var password = document.getElementById('pw').value.trim();
  if (!email || !password) return alert('请填写邮箱和密码');
  if (password.length < 6) return alert('密码至少6位');
  if (!confirm('注册 ' + email + ' ？')) return;
  document.getElementById('loginBtn').textContent = '⏳...';
  auth.createUserWithEmailAndPassword(email, password).then(user => {
    alert('✅ 注册成功！');
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('who').textContent = '👤 ' + user.user.email;
    document.getElementById('loadingScreen').style.display = 'flex';
    loadData(() => {
      loadAll();
      document.getElementById('loadingScreen').style.display = 'none';
    });
    document.getElementById('loginBtn').textContent = '登 录';
  }).catch(err => {
    alert('❌ ' + err.message);
    document.getElementById('loginBtn').textContent = '登 录';
  });
}

function logout() {
  if (confirm('确定退出？')) {
    auth.signOut().then(() => {
      document.getElementById('login').classList.remove('hide');
      document.getElementById('app').classList.add('hide');
      document.getElementById('who').textContent = '👤 未登录';
      cart = [];
      drawCart();
    });
  }
}

function resetPassword() {
  var email = document.getElementById('un').value.trim();
  if (!email) return alert('请输入邮箱');
  auth.sendPasswordResetEmail(email).then(() => alert('✅ 重置邮件已发送')).catch(err => alert('❌ ' + err.message));
}

function changePassword() {
  var old = document.getElementById('oldPw').value.trim();
  var newPw = document.getElementById('newPw').value.trim();
  var confirm = document.getElementById('confirmPw').value.trim();
  if (!old || !newPw || !confirm) return alert('请填写完整');
  if (newPw.length < 6) return alert('新密码至少6位');
  if (newPw !== confirm) return alert('两次密码不一致');
  var user = auth.currentUser;
  if (!user) return alert('请先登录');
  var cred = firebase.auth.EmailAuthProvider.credential(user.email, old);
  user.reauthenticateWithCredential(cred).then(() => {
    user.updatePassword(newPw).then(() => alert('✅ 密码修改成功'));
  }).catch(err => alert('❌ ' + err.message));
}

// ============================================================
//  业务功能
// ============================================================
var cart = [];
function today() { return new Date().toISOString().slice(0,10); }
function now() { return new Date().toISOString(); }
function thisMonth() { return today().slice(0,7); }

function page(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  var map = ['dash','pos','orders','staff','settings'];
  document.querySelectorAll('.tabs button').forEach((b,i) => { if(map[i]===name) b.classList.add('active'); });
  if(name==='staff') loadStaff();
  if(name==='orders') loadOrders();
  loadAll();
}

function loadAll() {
  refreshData();
  loadDashboard();
  loadPOS();
  loadStaff();
  loadOrders();
  document.getElementById('totalMembers').textContent = customers.length;
  document.getElementById('totalStaff').textContent = staffs.length;
}

// ============================================================
//  Dashboard
// ============================================================
function loadDashboard() {
  var todayOrders = orders.filter(o => o.status === 'paid' && o.date === today());
  var todaySales = todayOrders.reduce((s,o) => s + o.total, 0);
  document.getElementById('todaySales').textContent = 'RM ' + todaySales.toFixed(2);
  document.getElementById('todayOrders').textContent = todayOrders.length;
  document.getElementById('totalMembers').textContent = customers.length;
  document.getElementById('totalStaff').textContent = staffs.length;
  var tbody = document.getElementById('todayDetail');
  if (todayOrders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:12px">暂无消费</td></tr>';
  } else {
    tbody.innerHTML = todayOrders.slice().reverse().map(o => {
      var items = o.items ? o.items.map(i => i.name).join('、') : '-';
      return '<tr><td>' + (o.time||'') + '</td><td>' + (o.customer_name||'散客') + '</td><td>' + (o.staff_name||'-') + '</td><td>' + items + '</td><td>RM' + o.total.toFixed(2) + '</td><td>' + o.payment + '</td></tr>';
    }).join('');
  }
}

// ============================================================
//  POS
// ============================================================
function findOption(id) {
  for (var c of categories) {
    for (var o of c.options) {
      if (o.id === id) return {category: c, option: o};
    }
  }
  return null;
}

function addToCart(id) {
  var found = findOption(id);
  if (!found) return;
  var existing = cart.find(item => item.optionId === id);
  if (existing) { existing.quantity += 1; } else {
    cart.push({optionId: found.option.id, categoryName: found.category.name, optionName: found.option.name, price: found.option.price, rate: found.option.rate, quantity: 1});
  }
  drawCart();
  updateProductGrid();
}

function removeFromCart(id) {
  var idx = cart.findIndex(item => item.optionId === id);
  if (idx === -1) return;
  if (cart[idx].quantity > 1) { cart[idx].quantity -= 1; } else { cart.splice(idx, 1); }
  drawCart();
  updateProductGrid();
}

function removeItemCompletely(idx) {
  cart.splice(idx, 1);
  drawCart();
  updateProductGrid();
}

function updateProductGrid() {
  var container = document.getElementById('productContainer');
  if (!container) return;
  var items = container.querySelectorAll('.product-item');
  items.forEach(el => {
    var oid = parseInt(el.dataset.optionId);
    var cartItem = cart.find(c => c.optionId === oid);
    var qtyNum = el.querySelector('.qty-num');
    if (cartItem) { el.classList.add('selected');
      qtyNum.textContent = cartItem.quantity; } else { el.classList.remove('selected');
      qtyNum.textContent = '0'; }
  });
  updateTotal();
}

function toggleCategory(catId) {
  var body = document.getElementById('catBody_' + catId);
  var arrow = document.getElementById('catArrow_' + catId);
  if (!body) return;
  body.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open');
}

function renderProductGrid() {
  var container = document.getElementById('productContainer');
  if (!container) return;
  if (categories.length === 0) {
    container.innerHTML = '<p class="text-muted" style="padding:20px;text-align:center">暂无服务，请在「设置」中添加</p>';
    return;
  }
  var html = '';
  categories.forEach(cat => {
    html += '<div class="category-section">';
    html += '<div class="category-header" onclick="toggleCategory(' + cat.id + ')">' +
      '<span>' + cat.name + ' <span style="font-size:11px;background:#c9a84c;color:#fff;padding:1px 8px;border-radius:10px;">' + cat.options.length + '</span></span>' +
      '<span class="arrow" id="catArrow_' + cat.id + '">▼</span></div>';
    html += '<div class="category-body" id="catBody_' + cat.id + '"><div class="product-grid">';
    cat.options.forEach(opt => {
      html += '<div class="product-item" data-option-id="' + opt.id + '">' +
        '<div class="p-name">' + opt.name + '</div>' +
        '<div class="p-price">RM ' + opt.price.toFixed(2) + '</div>' +
        '<div class="qty-control">' +
        '<button class="minus-btn" onclick="removeFromCart(' + opt.id + ')">−</button>' +
        '<span class="qty-num">0</span>' +
        '<button class="plus-btn" onclick="addToCart(' + opt.id + ')">+</button></div></div>';
    });
    html += '</div></div></div>';
  });
  container.innerHTML = html;
  updateProductGrid();
}

function drawCart() {
  var tbody = document.getElementById('cartBody');
  if (!tbody) return;
  if (cart.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:20px">请选择服务</td></tr>';
  } else {
    tbody.innerHTML = cart.map((item, idx) => {
      var subtotal = item.price * item.quantity;
      return '<tr><td>' + item.categoryName + ' · ' + item.optionName + '</td>' +
        '<td style="text-align:center">RM ' + item.price.toFixed(2) + '</td>' +
        '<td style="text-align:center"><div class="qty-cell">' +
        '<button class="minus-btn" onclick="removeFromCart(' + item.optionId + ')">−</button>' +
        '<span class="qty-num">' + item.quantity + '</span>' +
        '<button class="plus-btn" onclick="addToCart(' + item.optionId + ')">+</button></div></td>' +
        '<td style="text-align:center">RM ' + subtotal.toFixed(2) + '</td>' +
        '<td style="text-align:center"><button onclick="removeItemCompletely(' + idx + ')" class="red" style="padding:2px 8px;font-size:12px;min-height:26px">✕</button></td></tr>';
    }).join('');
  }
  updateTotal();
}

function updateTotal() {
  var total = cart.reduce((s,item) => s + (item.price * item.quantity), 0);
  document.getElementById('sum').textContent = 'RM ' + total.toFixed(2);
}

function loadPOS() {
  var cusSelect = document.getElementById('cus');
  cusSelect.innerHTML = '<option value="">散客</option>' + customers.map(c => '<option value="' + c.id + '">' + c.name + ' · RM' + c.balance.toFixed(2) + '</option>').join('');
  var stSelect = document.getElementById('st');
  stSelect.innerHTML = staffs.map(s => '<option value="' + s.id + '">' + s.name + '</option>').join('');
  renderProductGrid();
  drawCart();
}

// ============================================================
//  收款
// ============================================================
function checkout() {
  if (cart.length === 0) return alert('请选择服务');
  var customerId = document.getElementById('cus').value;
  var staffId = document.getElementById('st').value;
  var payment = document.getElementById('pay').value;
  var total = cart.reduce((s,item) => s + (item.price * item.quantity), 0);
  if (total <= 0) return alert('总金额必须大于0');
  
  if (payment === '会员储值') {
    var cus = customers.find(c => c.id == customerId);
    if (!cus) return alert('请选择会员');
    if (cus.balance < total) return alert('余额不足！');
    cus.balance -= total;
  }
  
  var cusName = customerId ? (customers.find(c => c.id == customerId) || {}).name : '散客';
  var staffName = staffId ? (staffs.find(s => s.id == staffId) || {}).name : '未分配';
  var orderItems = [];
  cart.forEach(item => {
    for (var i = 0; i < item.quantity; i++) {
      orderItems.push({name: item.categoryName + ' · ' + item.optionName, price: item.price, rate: item.rate});
    }
  });
  
  var order = {
    id: nextId.order++,
    date: today(),
    time: new Date().toTimeString().slice(0,5),
    customer_id: customerId || null,
    customer_name: cusName,
    staff_id: staffId || null,
    staff_name: staffName,
    total: total,
    payment: payment,
    status: 'paid',
    items: orderItems,
    refund_amount: 0,
    created: now()
  };
  
  orders.push(order);
  if (customerId) {
    var c2 = customers.find(c => c.id == customerId);
    if (c2) { c2.visit = (c2.visit || 0) + 1; }
  }
  
  cart = [];
  drawCart();
  renderProductGrid();
  saveData();
  loadAll();
  
  alert('✅ 收款成功！\n💰 金额: RM' + total.toFixed(2) + '\n📋 订单号: #' + order.id);
}

// ============================================================
//  员工管理
// ============================================================
function loadStaff() {
  var tbody = document.getElementById('staffList');
  if (staffs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:20px">暂无员工</td></tr>';
    return;
  }
  var monthStr = thisMonth();
  tbody.innerHTML = staffs.map(s => {
    var staffOrders = orders.filter(o => o.status === 'paid' && o.staff_id == s.id && o.date.startsWith(monthStr));
    var totalSales = staffOrders.reduce((sum,o) => sum + o.total, 0);
    var totalComm = totalSales * (s.rate / 100);
    return '<tr><td><b>' + s.name + '</b></td><td>' + (s.rate||40) + '%</td><td>RM' + totalSales.toFixed(2) + '</td><td>RM' + totalComm.toFixed(2) + '</td><td><button onclick="removeStaff(' + s.id + ')" class="red" style="padding:4px 10px;font-size:12px">删除</button></td></tr>';
  }).join('');
}

function addStaff() {
  var name = document.getElementById('sn').value.trim();
  var rate = parseFloat(document.getElementById('srate').value) || 40;
  if (!name) return alert('请输入姓名');
  staffs.push({id: nextId.staff++, name: name, rate: rate, paid_periods: []});
  saveData();
  loadAll();
  document.getElementById('sn').value = '';
  alert('✅ 添加成功');
}

function removeStaff(id) {
  if (!confirm('确定删除？')) return;
  staffs = staffs.filter(s => s.id !== id);
  saveData();
  loadAll();
}

// ============================================================
//  订单报表
// ============================================================
function loadOrders() {
  var tbody = document.getElementById('orderRows');
  if (orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:20px">暂无订单</td></tr>';
    return;
  }
  tbody.innerHTML = orders.slice().reverse().map(o => {
    var status = o.status === 'paid' ? '✅ 已收款' : '已退款';
    return '<tr><td>#' + o.id + '</td><td>' + o.date + ' ' + (o.time||'') + '</td><td>' + (o.customer_name||'散客') + '</td><td>RM' + o.total.toFixed(2) + '</td><td>' + o.payment + '</td><td><span class="badge green">' + status + '</span></td></tr>';
  }).join('');
}

// ============================================================
//  数据管理
// ============================================================
function exportData() {
  var data = {categories, customers, staff: staffs, orders, nextId};
  var json = JSON.stringify(data);
  localStorage.setItem('ys_backup', json);
  navigator.clipboard.writeText(json).then(() => alert('✅ 已复制到剪贴板'));
}

function importData() {
  navigator.clipboard.readText().then(text => {
    try { var data = JSON.parse(text);
      categories = data.categories || [];
      customers = data.customers || [];
      staffs = data.staff || [];
      orders = data.orders || [];
      nextId = data.nextId || {customer:1,order:1,product:1,appt:1,expense:1,settlement:1,category:6,option:504,staff:3};
      saveData();
      loadAll();
      alert('✅ 导入成功'); } catch(e) { alert('❌ 无效数据'); }
  });
}

function clearAllData() {
  if (!confirm('⚠️ 确定清除所有数据？')) return;
  db.ref('/').set({initialized: true}).then(() => { alert('已清除');
    location.reload(); });
}

// ============================================================
//  监听登录状态
// ============================================================
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('who').textContent = '👤 ' + user.email;
    document.getElementById('loadingScreen').style.display = 'flex';
    loadData(() => {
      loadAll();
      document.getElementById('loadingScreen').style.display = 'none';
    });
  } else {
    document.getElementById('login').classList.remove('hide');
    document.getElementById('app').classList.add('hide');
    document.getElementById('loadingScreen').style.display = 'none';
  }
});

document.getElementById('loginBtn').onclick = function(e) {
  e.preventDefault();
  login();
};
document.getElementById('un').addEventListener('keypress', function(e) {
